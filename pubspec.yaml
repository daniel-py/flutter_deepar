name: flutter_deepar
description: >
  Flutter plugin for the DeepAR augmented reality SDK. Provides camera capture,
  AR effect loading/switching, and a stream of AR-processed frames (RGBA/BGRA)
  for use in live streaming, recording, or preview.
version: 0.1.5
homepage: https://github.com/daniel-py/flutter_deepar
repository: https://github.com/daniel-py/flutter_deepar

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.deepar.flutter_deepar
        pluginClass: FlutterDeeparPlugin
      ios:
        pluginClass: FlutterDeeparPlugin
